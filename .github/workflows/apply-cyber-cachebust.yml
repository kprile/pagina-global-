name: Apply cyber cache bust

on:
  push:
    branches:
      - opt/pagespeed-2026-08-20
    paths:
      - '.github/workflows/apply-cyber-cachebust.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/pagespeed-2026-08-20
      - name: Apply direct cyber layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<link rel="stylesheet" href="./premium.css">', '<link rel="stylesheet" href="./premium.css?v=cyber4">\n<link rel="stylesheet" href="./premium-v2.css?v=cyber4">')
          s = s.replace('<script defer src="./premium.js"></script>', '<script defer src="./premium.js?v=cyber4"></script>')
          s = s.replace('Importadora directa · Chile', 'GLOBAL TIRES // PERFORMANCE DIVISION')
          s = s.replace('Neumáticos para auto, camioneta y carga', 'TRACCIÓN SIN CONCESIONES')
          s = s.replace('Importamos y vendemos directo las marcas <strong style="color:#eceae6;">Grenlander</strong>, <strong style="color:#eceae6;">Haida</strong> y <strong style="color:#eceae6;">Tianfu</strong>. Busca tu medida y cotiza al instante por WhatsApp.', 'Neumáticos para <strong style="color:#eceae6;">auto, SUV y carga</strong>. Importación directa, stock real y atención mayorista en Chile.')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Forzar experiencia cyber y romper cache"
            git push origin HEAD:opt/pagespeed-2026-08-20
          fi
