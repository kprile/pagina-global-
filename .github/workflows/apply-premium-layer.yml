name: Apply premium visual layer

on:
  push:
    branches:
      - opt/pagespeed-2026-08-20
    paths:
      - .github/workflows/apply-premium-layer.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/pagespeed-2026-08-20

      - name: Load premium CSS and JS
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '<script src="./support.js"></script>'
          new = '<script src="./support.js"></script>\n<link rel="stylesheet" href="./premium.css">\n<script defer src="./premium.js"></script>'
          if './premium.css' not in html:
              if old not in html:
                  raise SystemExit('No se encontro support.js en index.html')
              html = html.replace(old, new, 1)
          p.write_text(html, encoding='utf-8')

      - name: Validate premium layer
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          for required in ('./premium.css', './premium.js', './support.js'):
              if required not in html:
                  raise SystemExit('Falta ' + required)

      - name: Commit premium loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Activar experiencia visual premium" || exit 0
          git push origin HEAD:opt/pagespeed-2026-08-20
