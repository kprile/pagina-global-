name: Apply PageSpeed HTML optimizations

on:
  push:
    branches:
      - opt/pagespeed-2026-08-20
    paths:
      - .github/workflows/apply-pagespeed-html.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/pagespeed-2026-08-20

      - name: Patch index.html safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          replacements = [
              ('<script src="vendor/gsap.min.js"></script>', '<script defer src="vendor/gsap.min.js"></script>'),
              ('<script src="vendor/ScrollTrigger.min.js"></script>', '<script defer src="vendor/ScrollTrigger.min.js"></script>'),
              ('<img id="gtHeroImg" src="assets/hero-tire.webp" alt=""', '<img id="gtHeroImg" src="assets/hero-tire.webp" alt="" fetchpriority="high" loading="eager" decoding="async"'),
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit(f'Missing expected pattern: {old}')
              html = html.replace(old, new, 1)

          css = '''\n  /* PageSpeed: evita pintar tarjetas muy alejadas del viewport.\n     Conserva el DOM y todos los filtros/busqueda; solo difiere layout/paint. */\n  .gt-card{content-visibility:auto; contain-intrinsic-block-size:260px;}\n'''
          marker = '</style>'
          if css.strip() not in html:
              if marker not in html:
                  raise SystemExit('Missing </style> marker')
              html = html.replace(marker, css + marker, 1)

          if html == original:
              raise SystemExit('No changes made')

          path.write_text(html, encoding='utf-8')

      - name: Validate required optimizations
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'defer src="vendor/gsap.min.js"',
              'defer src="vendor/ScrollTrigger.min.js"',
              'fetchpriority="high" loading="eager" decoding="async"',
              'content-visibility:auto',
          ]
          missing = [x for x in checks if x not in html]
          if missing:
              raise SystemExit('Missing checks: ' + ', '.join(missing))

      - name: Commit optimized index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Optimizar carga inicial para PageSpeed" || exit 0
          git push origin HEAD:opt/pagespeed-2026-08-20
